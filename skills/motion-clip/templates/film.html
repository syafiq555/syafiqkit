<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1080), H = +(params.get('h') || 1920);
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const main = canvas.getContext('2d');
let g = main;
const offscreen = () => {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  return c;
};
const deviceLayer = offscreen(), blurLayer = offscreen(), frameLayer = offscreen();

let STORY, C, L;
const img = {};
let spoken = [];
const DRAFT = params.has('draft');

window.ready = new Promise((resolve, reject) => {
  const script = document.createElement('script');
  script.src = params.get('story') || 'story.js';
  script.onload = () => Promise.resolve().then(start).then(resolve, reject);
  script.onerror = () => reject(new Error(`story failed to load: ${script.src}`));
  document.head.appendChild(script);
});

if (!navigator.webdriver) {
  Object.assign(canvas.style, { maxWidth: '100vw', maxHeight: '100vh', margin: '0 auto' });
  window.ready.then(() => {
    const begin = performance.now();
    const frame = (now) => { draw(((now - begin) / 1000) % STORY.duration); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }, (err) => {
    const hint = location.protocol === 'http:' || location.protocol === 'https:'
      ? 'Check the story file and the assets folder next to film.html.'
      : 'Open film.html through a local web server (render.mjs serves one), not as a file.';
    g.fillStyle = '#FFF4F2';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#B42318';
    g.font = `600 ${Math.round(W * 0.035)}px sans-serif`;
    g.textAlign = 'center';
    g.fillText('The film could not start', W / 2, H * 0.45);
    g.fillStyle = '#333333';
    g.font = `400 ${Math.round(W * 0.025)}px sans-serif`;
    g.fillText(String(err && err.message || err), W / 2, H * 0.5, W * 0.9);
    g.fillText(hint, W / 2, H * 0.54, W * 0.9);
  });
}

function start() {
  STORY = window.STORY;
  if (!STORY) throw new Error(`${params.get('story') || 'story.js'} did not set window.STORY`);
  STORY.screens = Array.isArray(STORY.screens) ? STORY.screens : [];
  STORY.frame = STORY.frame || 'phone';
  if (!['phone', 'browser', 'none'].includes(STORY.frame)) throw new Error(`STORY.frame must be "phone", "browser" or "none", got "${STORY.frame}"`);
  STORY.duration = STORY.duration || 20;
  STORY.device = { enter: 2, leave: STORY.duration - 5, ...(STORY.device || STORY.phone) };
  if (STORY.logoBlend) {
    probe.globalCompositeOperation = STORY.logoBlend;
    if (probe.globalCompositeOperation !== STORY.logoBlend) throw new Error(`STORY.logoBlend is not a canvas blend mode: "${STORY.logoBlend}"`);
  }
  const st = STORY.stat;
  if (st && (![st.value, st.at, st.out].every((v) => v !== null && v !== '' && Number.isFinite(Number(v))) || (st.from != null && !Number.isFinite(Number(st.from))))) {
    throw new Error('STORY.stat needs numeric value, at and out (and from, if given)');
  }
  if (STORY.shot && !(STORY.shot.w > 0 && STORY.shot.h > 0)) throw new Error('STORY.shot needs a positive w and h');
  STORY.hook = STORY.hook || [];
  STORY.taps = STORY.taps || [];
  STORY.captions = STORY.captions || [];
  STORY.camera = STORY.camera || [];
  STORY.music = STORY.music || {};
  STORY.voice = STORY.voice || [];
  if (!Array.isArray(STORY.voice) || STORY.voice.some((v) => !v || !Number.isFinite(Number(v.at)) || !String(v.text || '').trim())) {
    throw new Error('STORY.voice must be a list of { at, text } lines, each with a numeric at and some text');
  }
  STORY.spotlights = STORY.spotlights || [];
  STORY.photos = STORY.photos || [];
  STORY.photos.forEach((p, i) => {
    if (!p || !p.file || !(Number(p.to) > Number(p.from))) throw new Error(`STORY.photos[${i}] needs a file, and numeric from and to with to after from`);
  });
  STORY.backdrops = STORY.backdrops || [];
  STORY.backdrops.forEach((b, i) => {
    if (!b || !(b.name || b.file) || !Number.isFinite(Number(b.from)) || !Number.isFinite(Number(b.to)) || Number(b.to) <= Number(b.from)) {
      throw new Error(`STORY.backdrops[${i}] needs a name or file, and numeric from and to with to after from`);
    }
  });
  if (STORY.subtitles === true) STORY.subtitles = {};
  STORY.fonts = STORY.fonts || {};
  STORY.fonts.heading = { family: 'Helvetica Neue', weight: 800, ...STORY.fonts.heading };
  STORY.fonts.body = { family: 'Helvetica Neue', weight: 600, ...STORY.fonts.body };
  C = {
    page: '#F7F7F5', ink: '#1B1B1B', inkMuted: '#555555', accent: '#2F6FEB', accentSoft: '#DCE7FC',
    highlight: '#2F6FEB', surface: '#FFFFFF', line: '#D9D9D6', bezel: '#111111', ...STORY.colors,
  };
  Object.values(C).forEach(rgbOf);
  L = layout();
  document.body.style.background = C.page;
  window.cues = buildCues();
  const loads = [
    ...STORY.screens.map((s) => load(s.name, s.file || `assets/screens/${s.name}.png`)),
    loadFont(STORY.fonts.heading),
    loadFont(STORY.fonts.body),
  ];
  if (STORY.logo) loads.push(load('logo', STORY.logo));
  STORY.backdrops.forEach((b, i) => {
    const file = backdropFile(b);
    loads.push(load(`backdrop${i}`, file));
    if (b.depth) loads.push(load(`depth${i}`, typeof b.depth === 'string' ? b.depth : file.replace(/\.[^./]+$/, '.depth.png')));
  });
  STORY.photos.forEach((p, i) => loads.push(load(`photo${i}`, p.file)));
  if (STORY.products) STORY.products.files.forEach((f, i) => loads.push(load(`product${i}`, f)));
  if (STORY.subtitles) loads.push(loadWords(STORY.subtitles.file || 'assets/voice/words.json'));
  return Promise.all(loads).then(() => { resolveShot(); draw(0); });
}

function backdropFile(b) {
  return b.file || `assets/screens/${b.name}.png`;
}

function loadWords(src) {
  return fetch(src).then((r) => (r.ok ? r.json() : null)).then((lines) => {
    if (!lines) {
      console.warn(`subtitles are on but ${src} does not exist yet: run voice.mjs, then words.py`);
      return;
    }
    spoken = lines.map((line) => line.words.filter((w) => w.text.trim()));
  });
}

function resolveShot() {
  const first = STORY.screens.map((s) => img[s.name]).find(Boolean);
  if (!STORY.shot) {
    STORY.shot = first ? { w: first.naturalWidth, h: first.naturalHeight } : STORY.frame === 'phone' ? { w: 1170, h: 2532 } : { w: 1440, h: 900 };
  }
  const want = STORY.shot.w / STORY.shot.h;
  for (const s of STORY.screens) {
    const i = img[s.name];
    if (i && Math.abs(i.naturalWidth / i.naturalHeight / want - 1) > 0.01) {
      console.warn(`${s.name} is ${i.naturalWidth}x${i.naturalHeight} but shot is ${STORY.shot.w}x${STORY.shot.h}: the picture is cropped to fill`);
    }
  }
}

function load(name, src) {
  return new Promise((ok) => {
    const i = new Image();
    i.onload = () => { img[name] = i; ok(); };
    i.onerror = () => { console.warn(`image missing, drawing a placeholder: ${src}`); img[name] = null; ok(); };
    i.src = src;
  });
}
function loadFont({ family, weight, file }) {
  if (!file) return Promise.resolve();
  const face = new FontFace(family, `url("${file}")`, { weight: String(weight) });
  document.fonts.add(face);
  return face.load().catch(() => { throw new Error(`font failed to load: ${file}`); });
}

const color = (name) => C[name] || name;
const probe = document.createElement('canvas').getContext('2d');
function rgbOf(c) {
  let v = c;
  if (!/^#[0-9a-f]{6}$/i.test(c)) {
    probe.fillStyle = '#010203';
    probe.fillStyle = c;
    v = probe.fillStyle;
    if (v === '#010203' && String(c).trim().toLowerCase() !== '#010203') throw new Error(`colour not understood: ${c}`);
  }
  if (v[0] === '#') {
    const n = parseInt(v.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  return v.match(/[\d.]+/g).slice(0, 3).map(Number);
}
function rgba(c, a) {
  const [red, green, blue] = rgbOf(c);
  return `rgba(${red},${green},${blue},${a})`;
}

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeIn = (x) => { x = clamp(x); return x * x * x; };

function spring(x, k, d) {
  if (x <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-w0 * x) * (1 + w0 * x);
  if (z > 1) {
    const s = w0 * Math.sqrt(z * z - 1), r1 = -w0 * z + s, r2 = -w0 * z - s;
    return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1);
  }
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x));
}
const snappy = (x) => spring(x, 260, 24);
const smooth = (x) => spring(x, 170, 26);
const playful = (x) => spring(x, 130, 18);

function layout() {
  const vertical = W / H < 0.8;
  if (vertical) {
    return { vertical, align: 'center', textX: W / 2, capY: H * 0.105, cap: W * 0.074, hook: W * 0.15,
      phoneH: H * 0.66, cx: W / 2, cy: H * 0.6, boxW: W * 0.92, boxH: H * 0.62 };
  }
  const square = W / H < 1.2;
  return { vertical, align: 'left', textX: W * (square ? 0.07 : 0.09), capY: H * 0.42, cap: square ? W * 0.046 : H * 0.068,
    hook: square ? W * 0.1 : H * 0.15, phoneH: H * 0.84, cx: W * (square ? 0.75 : 0.72), cy: H * 0.53,
    boxW: W * (square ? 0.46 : 0.5), boxH: H * 0.84 };
}

function font(size, heading = true) {
  const f = heading ? STORY.fonts.heading : STORY.fonts.body;
  return `${f.weight} ${size}px "${f.family}"`;
}

function revealLine(text, x, y, size, fill, t0, t1, t, opts = {}) {
  const enter = snappy(t - t0);
  const leave = t1 == null ? 0 : easeIn((t - t1) / 0.3);
  if (enter <= 0 || leave >= 1) return;
  g.save();
  g.font = font(size, opts.heading !== false);
  g.textAlign = opts.align || L.align;
  g.textBaseline = 'alphabetic';
  let m = g.measureText(text);
  const fit = opts.maxWidth ?? (L.vertical ? W * 0.9 : L.cx - deviceGeometry().w / 2 - L.textX - W * 0.03);
  if (m.width > fit) {
    size *= fit / m.width;
    g.font = font(size, opts.heading !== false);
    m = g.measureText(text);
  }
  const left = g.textAlign === 'center' ? x - m.width / 2 : x;
  g.beginPath();
  g.rect(left - size, y - size * 1.05, m.width + size * 2, size * 1.35);
  g.clip();
  const dy = (1 - enter) * size * 1.2 - leave * size * 1.3;
  const soft = STORY.softText ? Math.max(1 - clamp(enter), leave) : 0;
  if (soft > 0.01) g.filter = `blur(${(soft * size * 0.14).toFixed(2)}px)`;
  if (opts.shadow) { g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = size * 0.35; g.shadowOffsetY = size * 0.04; }
  g.fillStyle = fill;
  g.fillText(text, x, y + dy);
  g.restore();
}

function lines(rows, t0, t1, t, size, startY, opts = {}) {
  rows.forEach((row, i) => {
    const [text, fill] = Array.isArray(row) ? row : [row, 'ink'];
    revealLine(text, opts.x ?? L.textX, startY + i * size * 1.12, size, color(opts.fill ? opts.fill(fill) : fill), t0 + i * 0.12, t1 == null ? null : t1 + i * 0.05, t, opts);
  });
}

function roundRect(x, y, w, h, r) {
  g.beginPath();
  roundRectPath(x, y, w, h, r);
}

function roundRectPath(x, y, w, h, r) {
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const STATUS = 47 / 844;
const BROWSER_BAR = 0.05;
function deviceGeometry() {
  const aspect = STORY.shot.w / STORY.shot.h;
  if (STORY.frame === 'phone') {
    const h = L.phoneH;
    const screenH = h * 0.965;
    const screenW = screenH / (1 + STATUS) * aspect;
    const bezel = h * 0.0175;
    return { screenW, screenH, w: screenW + bezel * 2, h: screenH + bezel * 2, topH: screenH * STATUS / (1 + STATUS),
      outerRadius: (screenW + bezel * 2) * 0.15, screenRadius: screenW * 0.13 };
  }
  const bar = STORY.frame === 'browser' ? BROWSER_BAR : 0;
  const screenW = Math.min(L.boxW, L.boxH / (1 / aspect + bar));
  const topH = screenW * bar;
  const screenH = screenW / aspect + topH;
  const radius = screenW * (bar ? 0.018 : 0.03);
  return { screenW, screenH, w: screenW, h: screenH, topH, outerRadius: radius, screenRadius: radius };
}

function statusBar(x, y, w, h, fill) {
  g.fillStyle = fill;
  g.fillRect(x, y, w, h);
  g.fillStyle = C.ink;
  g.font = font(h * 0.36, false);
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  g.fillText(STORY.statusTime || '9:41', x + w * 0.1, y + h * 0.55);
  const bw = h * 0.5, bh = h * 0.24, bx = x + w * 0.9 - bw, by = y + h * 0.55 - bh / 2;
  g.strokeStyle = C.ink; g.lineWidth = h * 0.03;
  roundRect(bx, by, bw, bh, bh * 0.3); g.stroke();
  roundRect(bx + h * 0.04, by + h * 0.04, bw * 0.7, bh - h * 0.08, bh * 0.2); g.fill();
  for (let i = 0; i < 4; i++) {
    const sh = bh * (0.35 + i * 0.22);
    g.fillRect(bx - h * 0.62 + i * h * 0.09, by + bh - sh, h * 0.055, sh);
  }
}

function browserBar(x, y, w, h) {
  g.fillStyle = C.surface;
  g.fillRect(x, y, w, h);
  g.fillStyle = C.line;
  g.fillRect(x, y + h - Math.max(1, h * 0.02), w, Math.max(1, h * 0.02));
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((dot, i) => {
    g.fillStyle = dot;
    g.beginPath(); g.arc(x + h * (0.55 + i * 0.42), y + h * 0.5, h * 0.13, 0, Math.PI * 2); g.fill();
  });
  const urlW = w * 0.5, urlH = h * 0.56, ux = x + (w - urlW) / 2, uy = y + (h - urlH) / 2;
  g.fillStyle = rgba(C.ink, 0.06);
  roundRect(ux, uy, urlW, urlH, urlH / 2); g.fill();
  g.fillStyle = C.inkMuted;
  g.font = font(urlH * 0.5, false);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText((STORY.browser && STORY.browser.url) || '', ux + urlW / 2, uy + urlH * 0.54, urlW * 0.9);
}

function placeholder(x, y, w, h, name) {
  g.fillStyle = C.line;
  g.fillRect(x, y, w, h);
  g.fillStyle = C.inkMuted;
  g.font = font(w * 0.06, false);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(`missing: ${name}`, x + w / 2, y + h / 2, w * 0.9);
}

function screenAt(t) {
  const list = STORY.screens;
  let i = 0;
  while (i + 1 < list.length && t >= list[i + 1].from) i++;
  const cur = list[i];
  if (i === 0) return [{ screen: cur, dx: 0, a: 1 }];
  const prev = list[i - 1];
  if (cur.via === 'fade') return [{ screen: prev, dx: 0, a: 1 }, { screen: cur, dx: 0, a: clamp((t - cur.from) / 0.18) }];
  const p = snappy(t - cur.from);
  return [{ screen: prev, dx: -0.3 * p, a: 1, dim: p }, { screen: cur, dx: 1 - p, a: 1, shadow: true }];
}

function camera(t) {
  const keys = STORY.camera;
  let c = { ...(keys[0] || { z: 1, x: 0.5, y: 0.5 }) };
  for (const k of keys.slice(1)) {
    const p = smooth(t - k.t);
    if (p <= 0) break;
    c = { z: lerp(c.z, k.z, p), x: lerp(c.x, k.x, p), y: lerp(c.y, k.y, p) };
  }
  return c;
}

function coverCrop(picture, w, h) {
  const pw = picture.naturalWidth, ph = picture.naturalHeight;
  if (Math.abs((pw / ph) / (w / h) - 1) <= 0.01) return { sx: 0, sy: 0, k: pw / w, ky: ph / h };
  const scale = Math.max(w / pw, h / ph);
  return { sx: (pw - w / scale) / 2, sy: (ph - h / scale) / 2, k: 1 / scale, ky: 1 / scale };
}

function drawCover(picture, x, y, w, h) {
  const c = coverCrop(picture, w, h);
  g.drawImage(picture, c.sx, c.sy, w * c.k, h * c.ky, x, y, w, h);
}

function tiltAt(t) {
  const tl = STORY.tilt;
  if (!tl) return { y: 0, x: 0 };
  const enter = 1 - clamp(spring(t - STORY.device.enter, 90, 17), 0, 1.2);
  const leave = easeIn((t - STORY.device.leave) / 0.5);
  const tx = tl.x ?? 0.18;
  return {
    y: enter * (tl.enter ?? 0.55) + leave * (tl.leave ?? -0.45),
    x: enter * tx + leave * tx * 0.6,
  };
}

function glProgram(gl, label, vertex, fragment) {
  const shader = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(`${label} shader: ${gl.getShaderInfoLog(s)}`);
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(program);
  gl.useProgram(program);
  return program;
}

function glTexture(gl) {
  const tx = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tx;
}

let tiltGL = null;
function tiltRenderer() {
  if (tiltGL !== null) return tiltGL;
  const surface = document.createElement('canvas');
  surface.width = W; surface.height = H;
  const gl = surface.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: true, alpha: true });
  if (!gl) return (tiltGL = false);
  const program = glProgram(gl, 'tilt', `
    attribute vec2 p; varying vec2 uv;
    uniform vec2 size, pivot, angle; uniform float dist;
    void main() {
      uv = p;
      vec3 q = vec3(p * size - pivot, 0.0);
      float cy = cos(angle.x), sy = sin(angle.x), cx = cos(angle.y), sx = sin(angle.y);
      q = vec3(q.x * cy + q.z * sy, q.y, -q.x * sy + q.z * cy);
      q = vec3(q.x, q.y * cx - q.z * sx, q.y * sx + q.z * cx);
      float w = (dist + q.z) / dist;
      vec2 s = (q.xy / w + pivot) / size;
      gl_Position = vec4(vec2(s.x * 2.0 - 1.0, 1.0 - s.y * 2.0) * w, 0.0, w);
    }`, `
    precision highp float; varying vec2 uv; uniform sampler2D layer;
    void main() { gl_FragColor = texture2D(layer, uv); }`);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const n = 24, verts = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const a = i / n, b = j / n, c = (i + 1) / n, d = (j + 1) / n;
    verts.push(a, b, c, b, a, d, c, b, c, d, a, d);
  }
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(at);
  gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
  glTexture(gl);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  const u = (name) => gl.getUniformLocation(program, name);
  tiltGL = (source, pivot, angle) => {
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.uniform2f(u('size'), W, H);
    gl.uniform2f(u('pivot'), pivot[0], pivot[1]);
    gl.uniform2f(u('angle'), angle.y, angle.x);
    gl.uniform1f(u('dist'), Math.max(W, H) * 1.6);
    gl.drawArrays(gl.TRIANGLES, 0, verts.length / 2);
    return surface;
  };
  return tiltGL;
}

function drawDevice(t) {
  const angle = tiltAt(t);
  const tilted = Math.abs(angle.y) > 0.002 || Math.abs(angle.x) > 0.002;
  const warp = tilted && tiltRenderer();
  if (!warp) { drawDeviceFlat(t); return; }
  const dg = deviceLayer.getContext('2d');
  dg.setTransform(1, 0, 0, 1, 0, 0);
  dg.clearRect(0, 0, W, H);
  const keep = g;
  g = dg;
  try { drawDeviceFlat(t); } finally { g = keep; }
  g.drawImage(warp(deviceLayer, [L.cx, L.cy], angle), 0, 0);
}

function drawDeviceFlat(t) {
  const enter = smooth(t - STORY.device.enter);
  const leave = easeIn((t - STORY.device.leave) / 0.45);
  if (!STORY.screens.length || enter <= 0 || leave >= 1) return;
  const geo = deviceGeometry();
  const cam = camera(t);
  const sideZoom = STORY.frame === 'phone' ? 0.25 : 0.6;
  const zoom = L.vertical ? cam.z : 1 + (cam.z - 1) * sideZoom;
  const cy = L.cy + (1 - enter) * H * 0.9 + leave * H;
  const rot = (1 - enter) * 0.08 - leave * 0.05;
  g.save();
  g.beginPath();
  if (L.vertical) g.rect(0, H * 0.2, W, H); else g.rect(W * 0.46, 0, W, H);
  g.clip();
  g.translate(L.cx, cy);
  g.rotate(rot);
  g.scale(zoom, zoom);
  g.translate(-(cam.x - 0.5) * geo.screenW * (L.vertical ? 1 : sideZoom), -(cam.y - 0.5) * geo.screenH * (L.vertical ? 1 : sideZoom));
  g.shadowColor = rgba(C.ink, 0.18);
  g.shadowBlur = geo.h * 0.05;
  g.shadowOffsetY = geo.h * 0.02;
  g.fillStyle = STORY.frame === 'phone' ? C.bezel : C.surface;
  roundRect(-geo.w / 2, -geo.h / 2, geo.w, geo.h, geo.outerRadius);
  g.fill();
  g.shadowColor = 'transparent';

  const sx = -geo.screenW / 2, sy = -geo.screenH / 2;
  const imgH = geo.screenH - geo.topH;
  g.save();
  roundRect(sx, sy, geo.screenW, geo.screenH, geo.screenRadius);
  g.clip();
  for (const layer of screenAt(t)) {
    const x = sx + layer.dx * geo.screenW;
    g.globalAlpha = layer.a;
    if (layer.shadow && layer.dx > 0.001) {
      g.fillStyle = rgba(C.ink, 0.12);
      g.fillRect(x - geo.screenW * 0.03, sy, geo.screenW * 0.03, geo.screenH);
    }
    if (STORY.frame === 'phone') statusBar(x, sy, geo.screenW, geo.topH, color(layer.screen.status || 'page'));
    if (STORY.frame === 'browser') browserBar(x, sy, geo.screenW, geo.topH);
    const picture = img[layer.screen.name];
    if (picture) drawCover(picture, x, sy + geo.topH, geo.screenW, imgH);
    else placeholder(x, sy + geo.topH, geo.screenW, imgH, layer.screen.name);
    if (layer.dim) { g.fillStyle = rgba(C.ink, 0.08 * layer.dim); g.fillRect(x, sy, geo.screenW, geo.screenH); }
    g.globalAlpha = 1;
  }

  spotlight(t, sx, sy + geo.topH, geo.screenW, imgH);

  const ok = STORY.success;
  if (ok && t > ok.at && t < ok.until) {
    const p = clamp((t - ok.at) / 0.7);
    const r = geo.screenW * (0.05 + 0.18 * easeInOut(p));
    g.strokeStyle = rgba(C.highlight, 0.5 * (1 - p));
    g.lineWidth = geo.screenW * 0.012;
    g.beginPath();
    g.arc(-geo.screenW / 2 + geo.screenW * (ok.x ?? 0.5), sy + geo.topH + imgH * ok.y, r, 0, Math.PI * 2);
    g.stroke();
  }

  const pointer = STORY.frame === 'phone' ? 0.065 : 0.022;
  for (const tap of STORY.taps) {
    if (t < tap.show || t > tap.hide) continue;
    if (STORY.cursor || tap.cursor) {
      const travel = Math.max(0.2, tap.at - 0.15 - tap.show);
      const m = easeInOut((t - tap.show) / travel);
      const [ax, ay] = tap.from, [bx, by] = tap.to;
      const kx = (ax + bx) / 2 + (by - ay) * 0.25, ky = (ay + by) / 2 - (bx - ax) * 0.25;
      const fx = (1 - m) * (1 - m) * ax + 2 * (1 - m) * m * kx + m * m * bx;
      const fy = (1 - m) * (1 - m) * ay + 2 * (1 - m) * m * ky + m * m * by;
      const px = sx + fx * geo.screenW, py = sy + geo.topH + fy * imgH;
      const press = t >= tap.at ? clamp(1 - (t - tap.at) / 0.18) : 0;
      if (t >= tap.at) {
        const q = clamp((t - tap.at) / 0.5);
        g.fillStyle = rgba(C.accent, 0.22 * (1 - q));
        g.beginPath(); g.arc(px, py, geo.screenW * (0.012 + 0.03 * easeInOut(q)), 0, Math.PI * 2); g.fill();
      }
      const fade = Math.min(clamp((t - tap.show) / 0.15), clamp((tap.hide - t) / 0.15));
      g.globalAlpha = fade;
      cursorArrow(px, py, geo.screenW * 0.0016 * (STORY.cursorScale ?? 1.3), press);
      g.globalAlpha = 1;
      continue;
    }
    const move = smooth(t - tap.show);
    const fx = lerp(tap.from[0], tap.to[0], move), fy = lerp(tap.from[1], tap.to[1], move);
    const px = sx + fx * geo.screenW, py = sy + geo.topH + fy * imgH;
    const press = t >= tap.at ? 1 - snappy(t - tap.at - 0.12) : snappy(t - tap.show);
    const pressing = t >= tap.at && t < tap.at + 0.12;
    const r = geo.screenW * pointer * (pressing ? 0.82 : 1) * clamp(press + (t >= tap.at ? 0.0001 : 0));
    g.fillStyle = rgba(C.ink, 0.28);
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = geo.screenW * pointer * (0.006 / 0.065);
    g.beginPath(); g.arc(px, py, Math.max(0, r), 0, Math.PI * 2); g.fill(); g.stroke();
    if (t >= tap.at) {
      const q = clamp((t - tap.at) / 0.45);
      g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - q)})`;
      g.lineWidth = geo.screenW * pointer * (0.008 / 0.065);
      g.beginPath(); g.arc(px, py, geo.screenW * pointer * (1 + (0.12 / 0.065) * q), 0, Math.PI * 2); g.stroke();
    }
  }
  g.restore();
  g.restore();
}

function spotlightLevel(s, t) {
  const inFor = Math.max(s.ease ?? 0.4, 1e-3), outFor = 0.25;
  if (t < s.from || t > s.to + outFor) return 0;
  return Math.min(easeInOut((t - s.from) / inFor), 1 - easeInOut((t - s.to) / outFor));
}

function spotlight(t, x, y, w, h) {
  for (const s of STORY.spotlights) {
    const a = spotlightLevel(s, t);
    if (a <= 0) continue;
    const [fx, fy, fw, fh] = s.rect;
    const pad = w * 0.012;
    const rx = x + fx * w - pad, ry = y + fy * h - pad, rw = fw * w + pad * 2, rh = fh * h + pad * 2;
    const r = Math.min(rw, rh) * 0.18;
    g.save();
    g.beginPath();
    g.rect(x - w, y - h, w * 3, h * 3);
    roundRectPath(rx, ry, rw, rh, r);
    g.fillStyle = rgba(C.ink, (s.dim ?? (STORY.frame === 'browser' ? 0.4 : 0.55)) * a);
    g.fill('evenodd');
    const picture = img[screenAt(t).slice(-1)[0].screen.name];
    const lift = 1 + (s.lift ?? 0.05) * a;
    if (picture) {
      const cx = rx + rw / 2, cy = ry + rh / 2;
      g.translate(cx, cy);
      g.scale(lift, lift);
      g.shadowColor = rgba(C.ink, 0.35 * a);
      g.shadowBlur = w * 0.05;
      g.shadowOffsetY = w * 0.015;
      const card = () => roundRect(-rw / 2, -rh / 2, rw, rh, r);
      card();
      g.fillStyle = C.surface;
      g.fill();
      g.shadowColor = 'transparent';
      g.save();
      card();
      g.clip();
      const c = coverCrop(picture, w, h);
      g.drawImage(picture, c.sx + (rx - x) * c.k, c.sy + (ry - y) * c.ky, rw * c.k, rh * c.ky, -rw / 2, -rh / 2, rw, rh);
      g.restore();
      g.strokeStyle = rgba(C.accent, 0.9 * a);
      g.lineWidth = w * 0.006;
      card();
      g.stroke();
    }
    g.restore();
  }
}

function cursorArrow(x, y, size, press) {
  g.save();
  g.translate(x, y);
  g.scale(size * (1 - 0.12 * press), size * (1 - 0.12 * press));
  g.beginPath();
  g.moveTo(0, 0); g.lineTo(0, 17); g.lineTo(4.2, 13.2); g.lineTo(7.2, 20); g.lineTo(10, 18.8);
  g.lineTo(7.1, 12.2); g.lineTo(12.6, 12.2); g.closePath();
  g.shadowColor = 'rgba(0,0,0,0.3)'; g.shadowBlur = 3; g.shadowOffsetY = 1.2;
  g.fillStyle = '#111111'; g.fill();
  g.shadowColor = 'transparent';
  g.lineWidth = 1.3; g.strokeStyle = '#FFFFFF'; g.stroke();
  g.restore();
}

function captions(t) {
  for (const c of STORY.captions) lines(c.rows, c.in, c.out, t, L.cap, L.capY);
}

function hook(t) {
  const size = L.hook;
  const cy = H * (L.vertical ? 0.44 : 0.46);
  const x = L.vertical ? W / 2 : L.textX;
  const opts = { maxWidth: L.vertical ? W * 0.9 : W - 2 * L.textX };
  STORY.hook.forEach((h, i) => revealLine(h.text, x, cy + i * size * 1.15, size, color(h.color || 'ink'), h.in, h.out, t, opts));
}

function numberScene(t) {
  const n = STORY.number;
  if (!n || t < n.from || t > n.to) return;
  const cols = 5, rows = Math.ceil(n.count / cols);
  const area = L.vertical ? W * 0.78 : Math.min(W * 0.5, H * 0.95);
  const cw = area / cols * 0.78, ch = cw * 0.62;
  const gx = area / cols, gy = ch * 1.35;
  const ox = L.cx - (gx * (cols - 1)) / 2;
  const oy = (L.vertical ? H * 0.58 : H * 0.6) - (gy * (rows - 1)) / 2;
  const merge = smooth(t - n.merge);
  const pillW = area * 0.82, pillH = ch * 1.5;
  const pcx = L.cx, pcy = L.vertical ? H * 0.58 : H * 0.6;
  for (let i = 0; i < n.count; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const drop = playful(t - (n.drop + i * n.every));
    if (drop <= 0) continue;
    const bx = lerp(ox + c * gx, pcx, merge), by = lerp(oy + r * gy - (1 - drop) * H * 0.25, pcy, merge);
    const s = lerp(1, 0.4, merge);
    if (merge > 0.92) continue;
    g.save();
    g.translate(bx, by);
    g.rotate((1 - drop) * (i % 2 ? 0.3 : -0.3));
    g.scale(s, s);
    g.fillStyle = C.surface;
    g.strokeStyle = C.line;
    g.lineWidth = cw * 0.025;
    roundRect(-cw / 2, -ch / 2, cw, ch, ch * 0.18); g.fill(); g.stroke();
    g.fillStyle = C.accentSoft;
    roundRect(-cw * 0.36, -ch * 0.22, cw * 0.5, ch * 0.14, ch * 0.07); g.fill();
    g.fillStyle = C.line;
    roundRect(-cw * 0.36, ch * 0.06, cw * 0.72, ch * 0.12, ch * 0.06); g.fill();
    g.restore();
  }
  const pill = playful(t - n.pill);
  const out = easeIn((t - n.pillOut) / 0.35);
  if (pill > 0 && out < 1) {
    g.save();
    g.translate(pcx, pcy);
    const s = pill * (1 - out);
    g.scale(s, s);
    g.fillStyle = C.accent;
    roundRect(-pillW / 2, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
    g.fillStyle = C.surface;
    g.font = font(pillH * 0.38);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(n.pillText, 0, pillH * 0.03);
    g.restore();
  }
  const tx = L.vertical ? W / 2 : L.textX;
  let ty = L.vertical ? H * 0.22 : L.capY;
  const opts = { align: L.vertical ? 'center' : 'left' };
  n.lines.forEach((line, i) => {
    if (i > 0) ty += L.cap * 1.45;
    revealLine(line.text, tx, ty, L.cap * (line.scale || 1), color(line.color || 'ink'), line.in, line.out, t, opts);
  });
}

function lockup(t) {
  const lk = STORY.lockup;
  if (!lk) return;
  const p = playful(t - lk.at);
  if (p <= 0) return;
  const size = L.vertical ? W * 0.3 : H * 0.3;
  const cx = W / 2, cy = H * (L.vertical ? 0.42 : 0.38);
  if (img.logo) {
    g.save();
    g.translate(cx, cy);
    g.scale(p, p);
    g.globalCompositeOperation = STORY.logoBlend || 'multiply';
    g.drawImage(img.logo, -size / 2, -size / 2, size, size);
    g.restore();
  }
  const word = L.vertical ? W * 0.11 : H * 0.11;
  const opts = { align: 'center', maxWidth: W * 0.9 };
  revealLine(lk.name, cx, cy + size * 0.42 + word * 0.6, word, C.ink, lk.at + 0.3, null, t, opts);
  if (lk.line) {
    revealLine(lk.line, cx, cy + size * 0.42 + word * 1.55, word * 0.32, C.inkMuted, lk.at + 0.6, null, t,
      { ...opts, heading: false });
  }
}

function decimalsOf(v) {
  const [mantissa, exp = '0'] = String(v).split('e');
  return clamp((mantissa.split('.')[1] || '').length - Number(exp), 0, 100);
}

function statScene(t) {
  const s = STORY.stat;
  if (!s || t < s.at || t > s.out + 0.4) return;
  const countFor = s.count ?? 0.9;
  const p = countFor > 0 ? easeInOut((t - s.at) / countFor) : 1;
  const decimals = clamp(s.decimals ?? decimalsOf(s.value), 0, 100);
  const shown = lerp(Number(s.from ?? 0), Number(s.value), p).toFixed(decimals).replace(/^-(0(\.0*)?)$/, '$1');
  const text = `${s.prefix || ''}${shown}${s.suffix || ''}`;
  const x = W / 2;
  const size = L.vertical ? W * 0.3 : H * 0.3;
  const y = H * (L.vertical ? 0.48 : 0.5);
  const opts = { align: 'center', maxWidth: W * 0.9 };
  revealLine(text, x, y, size, color(s.color || 'accent'), s.at, s.out, t, opts);
  if (s.label) revealLine(s.label, x, y + size * 0.55, L.cap, C.ink, s.at + 0.3, s.out + 0.05, t, opts);
  if (s.source) revealLine(s.source, x, y + size * 0.55 + L.cap * 1.3, L.cap * 0.4, C.inkMuted, s.at + 0.5, s.out + 0.1, t,
    { ...opts, heading: false });
}

let depthGL = null;
function depthRenderer() {
  if (depthGL !== null) return depthGL;
  const surface = document.createElement('canvas');
  surface.width = W; surface.height = H;
  const gl = surface.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false });
  if (!gl) {
    console.warn('WebGL is not available: backdrops draw without depth');
    return (depthGL = false);
  }
  const program = glProgram(gl, 'depth', `
    attribute vec2 p; varying vec2 uv;
    void main() { uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }`, `
    precision highp float;
    varying vec2 uv;
    uniform sampler2D picture, depth;
    uniform vec2 cover, offset, pan;
    uniform float zoom;
    void main() {
      vec2 base = 0.5 + (uv - 0.5) * cover / zoom + pan;
      vec2 q = base;
      for (int i = 0; i < 8; i++) q = base - offset * (texture2D(depth, q).r - 0.5);
      gl_FragColor = texture2D(picture, clamp(q, 0.001, 0.999));
    }`);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(at);
  gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
  const textures = new Map();
  const texture = (picture, unit) => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    if (!textures.has(picture)) {
      const tx = glTexture(gl);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, picture);
      textures.set(picture, tx);
    }
    gl.bindTexture(gl.TEXTURE_2D, textures.get(picture));
  };
  const uniform = (name) => gl.getUniformLocation(program, name);
  depthGL = (picture, depthMap, view) => {
    texture(picture, 0);
    texture(depthMap, 1);
    gl.uniform1i(uniform('picture'), 0);
    gl.uniform1i(uniform('depth'), 1);
    gl.uniform2f(uniform('cover'), view.cover[0], view.cover[1]);
    gl.uniform2f(uniform('offset'), view.offset[0], view.offset[1]);
    gl.uniform2f(uniform('pan'), view.pan[0], view.pan[1]);
    gl.uniform1f(uniform('zoom'), view.zoom);
    gl.viewport(0, 0, W, H);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    return surface;
  };
  return depthGL;
}

function backdrops(t) {
  STORY.backdrops.forEach((b, i) => {
    const from = Number(b.from), to = Number(b.to);
    const fade = b.fade ?? 0.5;
    if (t < from || t > to) return;
    const a = Math.min(from <= 0 ? 1 : clamp((t - from) / fade), to >= STORY.duration ? 1 : clamp((to - t) / fade));
    const picture = img[`backdrop${i}`];
    g.save();
    g.globalAlpha = a;
    if (!picture) {
      placeholder(0, 0, W, H, b.name || b.file);
      g.restore();
      return;
    }
    const p = easeInOut((t - from) / (to - from));
    const [z0, z1] = b.zoom || [1.04, 1.14];
    const zoom = lerp(z0, z1, p);
    const [dx, dy] = b.drift || [0.03, 0.012];
    const ia = picture.naturalWidth / picture.naturalHeight, fa = W / H;
    const cover = ia > fa ? [fa / ia, 1] : [1, ia / fa];
    const depthMap = img[`depth${i}`];
    const draw3d = b.depth && depthMap && depthRenderer();
    if (draw3d) {
      const strength = b.strength ?? 0.05;
      const view = { cover, zoom, pan: [0, 0], offset: [(p - 0.5) * strength * Math.sign(dx || 1), (p - 0.5) * strength * 0.4 * Math.sign(dy || 1)] };
      g.drawImage(draw3d(picture, depthMap, view), 0, 0, W, H);
    } else {
      const cw = picture.naturalWidth * cover[0] / zoom, ch = picture.naturalHeight * cover[1] / zoom;
      const sx = (picture.naturalWidth - cw) / 2 + (p - 0.5) * dx * picture.naturalWidth;
      const sy = (picture.naturalHeight - ch) / 2 + (p - 0.5) * dy * picture.naturalHeight;
      g.drawImage(picture, clamp(sx, 0, picture.naturalWidth - cw), clamp(sy, 0, picture.naturalHeight - ch), cw, ch, 0, 0, W, H);
    }
    const dim = b.dim ?? 0.3;
    if (dim > 0) {
      g.fillStyle = rgba(color(b.dimColor || 'page'), dim);
      g.fillRect(0, 0, W, H);
    }
    g.restore();
  });
}

function subtitleGroups(words, per) {
  const groups = [];
  for (let k = 0; k < words.length; k += per) {
    const take = per > 1 && words.length - k === per + 1 ? per + 1 : per;
    groups.push(words.slice(k, k + take));
    if (take > per) break;
  }
  return groups;
}

function subtitles(t) {
  const s = STORY.subtitles;
  if (!s || !spoken.length) return;
  const per = s.words || 3;
  for (const words of spoken) {
    if (!words.length || t < words[0].start - 0.05 || t > words[words.length - 1].end + 0.4) continue;
    const groups = subtitleGroups(words, per);
    let k = 0;
    while (k + 1 < groups.length && t >= groups[k + 1][0].start - 0.05) k++;
    const group = groups[k];
    const size = s.size ? L.cap * s.size : L.cap * (L.vertical ? 0.78 : 0.62);
    g.save();
    g.font = font(size);
    g.textBaseline = 'middle';
    g.textAlign = 'left';
    const space = g.measureText(' ').width;
    const widths = group.map((w) => g.measureText(w.text).width);
    let total = widths.reduce((x, y) => x + y, 0) + space * (group.length - 1);
    const padX = size * 0.45, padY = size * 0.3;
    const fit = (L.vertical ? W * 0.86 : W * 0.44 - L.textX) - padX * 2;
    const scale = total > fit ? fit / total : 1;
    const y = H * (s.y ?? (L.vertical ? 0.8 : 0.72));
    const pop = 0.94 + 0.06 * snappy(t - group[0].start + 0.05);
    g.translate(L.vertical ? W / 2 : L.textX + padX * scale + total * scale / 2, y);
    g.scale(scale * pop, scale * pop);
    g.fillStyle = rgba(color(s.background || 'surface'), s.backgroundAlpha ?? 0.92);
    roundRect(-total / 2 - padX, -size / 2 - padY, total + padX * 2, size + padY * 2, size * 0.35);
    g.fill();
    let x = -total / 2;
    group.forEach((w, j) => {
      g.fillStyle = color(t >= w.start ? (s.highlight || 'accent') : (s.color || 'ink'));
      g.fillText(w.text, x, size * 0.04);
      x += widths[j] + space;
    });
    g.restore();
  }
}

function ambient(t) {
  const a = STORY.ambient;
  if (!a) return;
  const alpha = a.alpha ?? 0.9;
  const blobs = [
    { c: a.colors?.[0] || 'accentSoft', alpha, r: 0.75, x: 0.15, y: 0.2, sx: 0.07, sy: 0.05, f: 0.11 },
    { c: a.colors?.[1] || 'highlight', alpha: alpha * 0.28, r: 0.6, x: 0.9, y: 0.85, sx: 0.06, sy: 0.07, f: 0.08 },
    { c: a.colors?.[2] || 'accent', alpha: alpha * 0.1, r: 0.5, x: 0.85, y: 0.1, sx: 0.05, sy: 0.04, f: 0.13 },
  ];
  const m = Math.max(W, H);
  for (const b of blobs) {
    const x = W * (b.x + b.sx * Math.sin(t * b.f * Math.PI * 2 / 3)), y = H * (b.y + b.sy * Math.cos(t * b.f * Math.PI * 2 / 4));
    const grad = g.createRadialGradient(x, y, 0, x, y, m * b.r);
    grad.addColorStop(0, rgba(color(b.c), b.alpha));
    grad.addColorStop(1, rgba(color(b.c), 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
  }
}

function photos(t) {
  STORY.photos.forEach((p, i) => {
    const from = Number(p.from), to = Number(p.to);
    if (t < from || t > to + 0.45) return;
    const picture = img[`photo${i}`];
    const open = spring(t - from, 120, 22);
    const close = easeInOut((t - to) / 0.45);
    const k = clamp(open);
    if (k * (1 - close) <= 0) return;
    g.save();
    const cw = lerp(W * 0.35, W * 1.02, k), ch = lerp(H * 0.25, H * 1.02, k);
    const ox = (p.origin?.[0] ?? 0.5) * W, oy = (p.origin?.[1] ?? 0.5) * H;
    const cx = lerp(ox, W / 2, k), cy = lerp(oy, H / 2, k);
    roundRect(cx - cw / 2, cy - ch / 2, cw, ch, Math.min(W, H) * 0.06 * (1 - k));
    g.clip();
    g.globalAlpha = clamp(open * 3) * (1 - close);
    if (picture) {
      const prog = (t - from) / (to - from + 0.45);
      const [z0, z1] = p.zoom || [1.12, 1.0];
      const z = lerp(z0, z1, easeInOut(prog));
      const ia = picture.naturalWidth / picture.naturalHeight, fa = W / H;
      const sw = ia > fa ? picture.naturalHeight * fa : picture.naturalWidth;
      const sh = ia > fa ? picture.naturalHeight : picture.naturalWidth / fa;
      const fx = p.focus?.[0] ?? 0.5, fy = p.focus?.[1] ?? 0.5;
      const vw = sw / z, vh = sh / z;
      const vx = clamp(fx * picture.naturalWidth - vw / 2 + (prog - 0.5) * (p.drift ?? 0.02) * picture.naturalWidth, 0, picture.naturalWidth - vw);
      const vy = clamp(fy * picture.naturalHeight - vh / 2, 0, picture.naturalHeight - vh);
      g.drawImage(picture, vx, vy, vw, vh, 0, 0, W, H);
    } else placeholder(0, 0, W, H, p.file);
    if (p.rows) {
      const grad = g.createLinearGradient(0, H * 0.3, 0, H);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.55, `rgba(0,0,0,${(p.scrim ?? 0.75) * 0.7})`);
      grad.addColorStop(1, `rgba(0,0,0,${p.scrim ?? 0.75})`);
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);
    }
    g.restore();
    if (p.rows) {
      const size = L.vertical ? W * 0.085 : H * 0.085;
      const startY = H * (L.vertical ? 0.8 : 0.76);
      lines(p.rows, from + 0.35, to, t, size, startY, {
        x: L.vertical ? W / 2 : W * 0.07, align: L.vertical ? 'center' : 'left', shadow: true,
        maxWidth: W * (L.vertical ? 0.9 : 0.8), fill: (f) => (f === 'accent' ? (p.accent || 'highlight') : '#FFFFFF'),
      });
    }
  });
}

function products(t) {
  const pr = STORY.products;
  if (!pr || t < pr.from || t > pr.to + 0.4) return;
  const n = pr.files.length;
  const span = L.vertical ? W * 0.94 : W * 0.86;
  const cell = span / n;
  const card = Math.min(cell * 0.88, (L.vertical ? H * 0.16 : H * 0.2));
  const y = H * (pr.y ?? (L.vertical ? 0.72 : 0.83));
  const leave = easeIn((t - pr.to) / 0.4);
  pr.files.forEach((f, i) => {
    const p = playful(t - pr.from - i * (pr.every ?? 0.09));
    if (p <= 0) return;
    const x = W / 2 - span / 2 + cell * (i + 0.5);
    const s = clamp(p, 0, 1.2) * (1 - leave);
    g.save();
    g.translate(x, y + (1 - clamp(p)) * card * 0.6);
    g.scale(s, s);
    g.shadowColor = rgba(C.ink, 0.16);
    g.shadowBlur = card * 0.18;
    g.shadowOffsetY = card * 0.06;
    g.fillStyle = C.surface;
    roundRect(-card / 2, -card / 2, card, card, card * 0.16);
    g.fill();
    g.shadowColor = 'transparent';
    const picture = img[`product${i}`];
    if (picture) {
      const pad = card * 0.1, box = card - pad * 2;
      const r = Math.min(box / picture.naturalWidth, box / picture.naturalHeight);
      const dw = picture.naturalWidth * r, dh = picture.naturalHeight * r;
      g.drawImage(picture, -dw / 2, -dh / 2, dw, dh);
    }
    g.restore();
  });
}

function motionAt(t) {
  const d = 1 / 60;
  const a = camera(t), b = camera(t + d);
  let m = Math.abs(a.z - b.z) * 2 + Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  for (const s of STORY.screens.slice(1)) if (s.via !== 'fade' && t > s.from && t < s.from + 0.6) m += Math.abs(snappy(t + d - s.from) - snappy(t - s.from));
  m += Math.abs(smooth(t + d - STORY.device.enter) - smooth(t - STORY.device.enter));
  m += Math.abs(easeIn((t + d - STORY.device.leave) / 0.45) - easeIn((t - STORY.device.leave) / 0.45));
  for (const p of STORY.photos) if (t > p.from && t < p.from + 0.8) m += Math.abs(spring(t + d - p.from, 120, 22) - spring(t - p.from, 120, 22));
  return m;
}

function draftStamp(t) {
  const size = Math.round(Math.min(W, H) * 0.035);
  g.save();
  g.font = `600 ${size}px monospace`;
  g.textBaseline = 'top';
  g.textAlign = 'left';
  const label = `DRAFT  ${t.toFixed(2)} s`;
  g.fillStyle = 'rgba(0,0,0,0.6)';
  g.fillRect(size * 0.5, size * 0.5, g.measureText(label).width + size, size * 1.6);
  g.fillStyle = '#FFFFFF';
  g.fillText(label, size, size * 0.8);
  g.restore();
}

function drawFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'none';
  g.fillStyle = C.page;
  g.fillRect(0, 0, W, H);
  ambient(t);
  backdrops(t);
  hook(t);
  drawDevice(t);
  captions(t);
  photos(t);
  numberScene(t);
  statScene(t);
  products(t);
  lockup(t);
  subtitles(t);
}

function draw(t) {
  const mb = STORY.motionBlur;
  const samples = mb ? (mb.samples ?? 8) : 1;
  if (samples > 1 && motionAt(t) > (mb.threshold ?? 0.004)) {
    const shutter = (mb.shutter ?? 0.5) / 30;
    const fg = frameLayer.getContext('2d'), bg = blurLayer.getContext('2d');
    bg.setTransform(1, 0, 0, 1, 0, 0);
    bg.globalAlpha = 1;
    bg.clearRect(0, 0, W, H);
    try {
      for (let k = 0; k < samples; k++) {
        g = fg;
        drawFrame(t - shutter / 2 + (shutter * k) / (samples - 1));
        bg.globalAlpha = 1 / (k + 1);
        bg.drawImage(frameLayer, 0, 0);
      }
    } finally {
      g = main;
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.drawImage(blurLayer, 0, 0);
  } else {
    g = main;
    drawFrame(t);
  }
  if (DRAFT) draftStamp(t);
}

function buildCues() {
  const s = STORY, m = s.music, d = s.device;
  const pushes = s.screens.filter((x, i) => i > 0 && x.via !== 'fade').map((x) => ({ at: x.from - 0.05, length: 0.35, rising: true, gain: 0.07, pan: 0.4 }));
  const cues = {
    bpm: m.bpm, mood: m.mood, duration: s.duration, groove: m.groove, hats_from: m.hatsFrom, intro_bell: m.introBell,
    taps: s.screens.length ? s.taps.map((x) => x.at) : [],
    whooshes: s.screens.length ? [
      { at: d.enter - 0.3, length: 0.6, rising: true, gain: 0.1 },
      ...pushes,
      { at: d.leave - 0.05, length: 0.5, rising: false, gain: 0.08 },
    ] : [],
    chimes: s.success && s.screens.length ? [
      { at: s.success.at - 0.05, note: 84, gain: 0.12, pan: -0.15 },
      { at: s.success.at + 0.07, note: 91, gain: 0.08, pan: 0.15 },
    ] : [],
    ending: s.lockup ? s.lockup.at : undefined,
  };
  if (s.number) {
    cues.ticks = { from: s.number.drop, every: s.number.every, count: s.number.count };
    cues.hit = s.number.pill;
    cues.chimes.push({ at: s.number.pill, note: 79, gain: 0.08, length: 1.2 });
  }
  if (s.stat) {
    cues.hit = cues.hit ?? s.stat.at + (s.stat.count ?? 0.9);
    cues.chimes.push({ at: s.stat.at + (s.stat.count ?? 0.9), note: 79, gain: 0.08, length: 1.2 });
  }
  if (s.voice.length) {
    cues.voice = s.voice.map((v, i) => {
      const under = s.captions.find((c) => c.in <= Number(v.at) && Number(v.at) < c.out);
      return { at: Number(v.at), text: String(v.text).trim(), file: v.file || `assets/voice/${String(i + 1).padStart(2, '0')}.wav`, captionOut: under ? under.out : undefined };
    });
  }
  const round = (x) => Math.round(x * 1000) / 1000;
  for (const list of [cues.whooshes, cues.chimes]) for (const c of list) c.at = round(c.at);
  return cues;
}

window.seek = (t) => { draw(t); return true; };
</script>
