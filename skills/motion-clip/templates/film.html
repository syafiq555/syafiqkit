function explainerBox() {
  if (L.vertical) {
    const e = STORY.explainerLayout || {};
    return { x: W * 0.115, w: W * 0.77, buildW: W * 0.6, kickerY: H * 0.17, headY: H * 0.235,
      head: W * 0.1, top: H * 0.33, bottom: H * (e.bottom ?? 0.56), row: W * (e.row ?? 0.056) };
  }
  const x = L.textX;
  return { x, w: W * 0.42, buildW: W * 0.4, kickerY: H * 0.2, headY: H * 0.3, head: L.cap * 1.3,
    top: H * 0.22, bottom: H * 0.86, row: L.cap * 0.62, buildX: W * 0.52 };
}

function wrapWords(words, size, maxW) {
  g.font = font(size);
  const space = g.measureText(' ').width;
  const rows = [[]];
  let width = 0;
  for (const w of words) {
    const ww = g.measureText(w).width;
    const row = rows[rows.length - 1];
    if (row.length && width + space + ww > maxW) { rows.push([w]); width = ww; }
    else { row.push(w); width += (row.length > 1 ? space : 0) + ww; }
  }
  return { rows, space };
}

function explainerHeadline(s, box, t) {
  const words = String(s.headline).trim().split(/\s+/);
  const marks = (s.mark || []).map((m) => String(m).toLowerCase());
  let size = box.head * (s.size || 1);
  let wrap = wrapWords(words, size, box.w);
  while (wrap.rows.length > 2 && size > box.head * 0.6) { size *= 0.92; wrap = wrapWords(words, size, box.w); }
  const step = s.step ?? 0.11;
  const start = headStart(s);
  const motion = STORY.explainerMotion || 'calm';
  const cps = s.cps ?? 24;
  const sync = motion === 'type' ? typeTimes(s, words, start) : null;
  const typed = sync ? syncedTyped(sync, words, t, cps) : (t - start) * cps;
  const total = words.join(' ').length;
  const typeEnd = sync ? sync[sync.length - 1] + words[words.length - 1].length / cps : start + total / cps;
  const fade = exitFade(t, s.out);
  let i = 0, lastEnd = 0, lastW = 0, chars = 0;
  wrap.rows.forEach((row, r) => {
    const y = box.headY + (size - box.head) * 0.85 + r * size * 1.08;
    let x = box.x;
    g.font = font(size);
    for (const w of row) {
      const clean = w.toLowerCase().replace(/[.,!?:;]+$/, '');
      const marked = marks.includes(clean);
      const fill = color(marked ? (s.markColor || 'highlight') : (s.color || 'ink'));
      const ww = g.measureText(w).width;
      if (motion === 'type') {
        const shown = Math.floor(clamp(typed - chars, 0, w.length));
        if (shown > 0 && fade > 0) {
          g.save();
          g.globalAlpha = fade;
          g.fillStyle = fill;
          g.textAlign = 'left';
          g.fillText(w.slice(0, shown), x, y);
          g.restore();
        }
        if (typed >= chars && typed < chars + w.length + 1 && (sync ? t < typeEnd + 0.6 : typed < total + cps * 0.6) && fade > 0) {
          const blink = typed >= total ? (Math.floor((sync ? t - typeEnd : t - start - total / cps) * 4) % 2 === 0) : true;
          if (blink) {
            g.save();
            g.globalAlpha = fade;
            g.fillStyle = color(s.accent || 'highlight');
            g.fillRect(x + g.measureText(w.slice(0, shown)).width + size * 0.04, y - size * 0.78, Math.max(4, size * 0.06), size * 0.92);
            g.restore();
          }
        }
      } else if (motion === 'punch') {
        const t0 = start + i * step;
        const p = playful(t - t0);
        if (p > 0 && fade > 0) {
          const k = marked ? 0.35 + 0.65 * p : 0.72 + 0.28 * p;
          g.save();
          g.globalAlpha = clamp(p * 1.8) * fade;
          g.translate(x + ww / 2, y - size * 0.36 + (1 - clamp(p)) * size * 0.35);
          g.scale(k, k);
          g.fillStyle = fill;
          g.textAlign = 'center';
          g.fillText(w, 0, size * 0.36);
          g.restore();
        }
      } else {
        revealLine(w, x, y, size, fill, start + i * step, s.out, t, { align: 'left', maxWidth: W, leaveFor: EXIT });
      }
      g.font = font(size);
      x += ww + wrap.space;
      chars += w.length + 1;
      i++;
    }
    lastEnd = y;
    lastW = x - wrap.space - box.x;
  });
  const barAt = motion === 'type' ? typeEnd + 0.05 : start + words.length * step + 0.05;
  const grow = smooth(t - barAt);
  if (grow > 0.03 && fade > 0 && s.underline !== false) {
    g.save();
    g.globalAlpha = fade;
    g.fillStyle = color(s.accent || 'highlight');
    const bh = Math.max(4, size * 0.075);
    g.fillRect(box.x, lastEnd + size * 0.2, lastW * clamp(grow, 0, 1.04), bh);
    g.restore();
  }
  return { bottom: lastEnd + size * 0.2, ready: barAt };
}

const typeCache = new Map();
const cleanWord = (w) => String(w).toLowerCase().replace(/^rm/, '').replace(/[^a-z0-9']/g, '').replace(/'s$/, '');
const NUMBER_WORDS = { 3: 'three', 10: 'ten', 2: 'two', 4: 'four' };

function typeTimes(s, words, start) {
  if (!(s.sync ?? STORY.typeSync) || !spoken.length) return null;
  if (typeCache.has(s)) return typeCache.get(s);
  const heard = spoken.flat().filter((w) => w.start >= s.at - 0.15 && w.start <= s.out);
  let from = 0;
  const found = words.map((w) => {
    const want = cleanWord(w);
    const alt = NUMBER_WORDS[want];
    for (let k = from; k < heard.length; k++) {
      const h = cleanWord(heard[k].text);
      if (h === want || (alt && h === alt)) { from = k + 1; return heard[k].start; }
    }
    return null;
  });
  const times = [];
  const pace = s.pace ?? STORY.typePace ?? 0.32;
  const cps = s.cps ?? 24;
  found.forEach((f, i) => {
    const prev = i ? times[i - 1] + words[i - 1].length / cps : start - 0.12;
    const due = start + 0.02 + i * pace;
    times.push(Math.max(start, prev + 0.06, Math.min(f ?? Infinity, due) - 0.04));
  });
  typeCache.set(s, times);
  return times;
}

function syncedTyped(times, words, t, cps) {
  let chars = 0;
  for (let i = 0; i < words.length; i++) {
    const n = clamp((t - times[i]) * cps, 0, words[i].length);
    if (n < words[i].length) return chars + n;
    chars += words[i].length + 1;
  }
  return chars;
}

function kickerLine(s, box, t) {
  const fade = exitFade(t, s.out);
  const p = snappy(t - s.at);
  if (p <= 0 || fade <= 0) return;
  const size = box.row * 1.08;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  g.font = font(size);
  g.letterSpacing = `${(size * 0.16).toFixed(1)}px`;
  const kw = g.measureText(String(s.kicker).toUpperCase()).width;
  if (kw > box.w) {
    g.font = font(size * box.w / kw);
    g.letterSpacing = `${(size * 0.16 * box.w / kw).toFixed(1)}px`;
  }
  g.textAlign = 'left';
  g.fillStyle = color(s.kickerColor || 'inkMuted');
  g.fillText(String(s.kicker).toUpperCase(), box.x, box.kickerY + (1 - clamp(p)) * size * 0.6);
  g.restore();
}

function buildRows(b, box, top, t, s) {
  const items = b.items || [];
  const size = box.row * (b.size || 1);
  const rowH = size * (b.kind === 'cards' ? 2.6 : 2.2);
  const gap = size * 0.45;
  const fade = exitFade(t, s.out);
  const x0 = box.buildX ?? box.x;
  items.forEach((it, i) => {
    const at = b.at + i * (b.every ?? 0.45);
    const p = snappy(t - at);
    if (p <= 0 || fade <= 0) return;
    const y = top + i * (rowH + gap);
    const it2 = typeof it === 'string' ? { text: it } : it;
    g.save();
    g.globalAlpha = clamp(p) * fade;
    g.translate((1 - p) * -size * 1.2, 0);
    const card = STORY.explainerCard || {};
    g.fillStyle = rgba(color(b.fill || card.fill || 'surface'), b.fillAlpha ?? card.alpha ?? 0.06);
    roundRect(x0, y, box.buildW, rowH, size * 0.3);
    g.fill();
    g.strokeStyle = rgba(color(b.stroke || card.stroke || 'line'), b.strokeAlpha ?? card.strokeAlpha ?? 0.35);
    g.lineWidth = 2;
    g.stroke();
    if (b.kind === 'cards') {
      g.fillStyle = color(it2.color || b.accent || 'highlight');
      g.fillRect(x0, y + size * 0.3, size * 0.14, rowH - size * 0.6);
      g.textAlign = 'left';
      g.fillStyle = color('ink');
      g.font = font(size * 1.05);
      g.fillText(it2.text, x0 + size * 0.7, y + rowH * (it2.sub ? 0.45 : 0.62), box.buildW - size * 1.2);
      if (it2.sub) {
        g.fillStyle = color(it2.subColor || 'inkMuted');
        g.font = font(size * 0.8, false);
        g.fillText(it2.sub, x0 + size * 0.7, y + rowH * 0.8, box.buildW - size * 1.2);
      }
    } else {
      const mark = it2.mark || b.mark || 'cross';
      const markColor = color(it2.markColor || b.markColor || (mark === 'check' ? 'highlight' : 'danger'));
      const mp = clamp((t - at - 0.25) / 0.35);
      icon(mark, x0 + size * 0.55, y + (rowH - size * 1.3) / 2, size * 1.3, markColor, mp, 2.6);
      g.textAlign = 'left';
      g.font = font(size, b.heading !== false);
      const tx = x0 + size * 2.4, ty = y + rowH * 0.63;
      const struck = mark === 'cross' && b.strike !== false;
      g.fillStyle = color(struck ? 'inkMuted' : 'ink');
      g.fillText(it2.text, tx, ty, box.buildW - size * 2.9);
      if (struck && mp > 0) {
        const tw = Math.min(g.measureText(it2.text).width, box.buildW - size * 2.9);
        g.fillStyle = markColor;
        g.fillRect(tx, ty - size * 0.33, tw * easeOutCubic((t - at - 0.35) / 0.25), Math.max(3, size * 0.07));
      }
    }
    g.restore();
  });
}

function buildBar(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  const p = snappy(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const size = box.row;
  const x0 = box.buildX ?? box.x, w = box.buildW;
  const barH = size * 1.6;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  g.textAlign = 'left';
  g.font = font(size * 0.85, false);
  g.fillStyle = color('inkMuted');
  g.fillText(b.maxLabel || '', x0, top + size * 0.9, w);
  const ty = top + size * 1.5;
  g.fillStyle = rgba(color(b.maxColor || 'danger'), 0.22);
  roundRect(x0, ty, w * clamp(p), barH, barH * 0.2);
  g.fill();
  g.fillStyle = color(b.maxColor || 'danger');
  g.font = font(size * 1.1);
  g.textAlign = 'right';
  g.fillText(b.maxValue || '', x0 + w - size * 0.4, ty + barH * 0.68, w * 0.6);
  const vy = ty + barH + size * 1.6;
  const vp = easeInOut((t - b.at - (b.delay ?? 0.7)) / 0.8);
  if (vp > 0) {
    const share = clamp(Number(b.value) / Number(b.max) || 0);
    const vw = Math.max(size * 0.35, w * share) * vp;
    g.textAlign = 'left';
    g.font = font(size * 0.85, false);
    g.fillStyle = color('inkMuted');
    g.fillText(b.valueLabel || '', x0, vy - size * 0.35, w);
    g.fillStyle = color(b.valueColor || 'highlight');
    roundRect(x0, vy, vw, barH, Math.min(barH * 0.2, vw / 2));
    g.fill();
    g.font = font(size * 1.1);
    g.fillText(b.valueText || '', x0 + vw + size * 0.5, vy + barH * 0.68, w);
  }
  g.restore();
}

function buildIcon(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  const p = snappy(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const size = (box.bottom - top) * (b.size || 0.62);
  const x0 = (box.buildX ?? box.x) + (b.align === 'center' ? (box.buildW - size) / 2 : 0);
  const y0 = top + (box.bottom - top - size) * 0.35;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  const cx = x0 + size / 2, cy = y0 + size / 2;
  if (b.ring !== false) {
    const pulse = clamp((t - b.at) / 1.2);
    g.strokeStyle = rgba(color(b.color || 'highlight'), 0.35 * (1 - pulse));
    g.lineWidth = 3;
    g.beginPath();
    g.arc(cx, cy, size * (0.55 + pulse * 0.25), 0, Math.PI * 2);
    g.stroke();
  }
  g.translate(cx, cy);
  const k = 0.85 + 0.15 * clamp(p, 0, 1.05);
  g.scale(k, k);
  icon(b.icon || 'doc', -size * 0.38, -size * 0.38, size * 0.76, color(b.color || 'highlight'), clamp((t - b.at) / 0.45), 1.4);
  if (b.crossed) {
    const ct = t - b.at - (b.crossAt ?? 0.5);
    if ((STORY.explainerMotion || 'calm') === 'punch') {
      if (ct > 0) {
        const stamp = 1.7 - 0.7 * playful(ct);
        const shake = Math.sin(ct * 70) * Math.exp(-ct * 14) * size * 0.04;
        g.save();
        g.translate(shake, 0);
        g.scale(stamp, stamp);
        g.globalAlpha = clamp(ct / 0.06) * fade;
        icon('cross', -size * 0.42, -size * 0.42, size * 0.84, color('danger'), 1, 2.6);
        g.restore();
      }
    } else icon('cross', -size * 0.42, -size * 0.42, size * 0.84, color('danger'), clamp(ct / 0.35), 2.2);
  }
  g.restore();
  if (b.label) {
    g.save();
    g.globalAlpha = clamp(p) * fade;
    g.font = font(box.row * 0.95);
    g.textAlign = 'center';
    g.fillStyle = color(b.labelColor || 'danger');
    g.fillText(b.label, cx, cy + size * 0.55 + box.row * 0.9, box.buildW);
    g.restore();
  }
}

function mascot(t) {
  const m = STORY.mascot;
  if (!m || !img.mascot) return;
  for (const span of m.spans || []) {
    if (t < span.from || t > span.to + EXIT) continue;
    const pin = playful(t - span.from) * exitFade(t, span.to);
    if (pin <= 0) continue;
    const bh = H * (span.height ?? m.height ?? 0.33) * clamp(pin, 0, 1.06);
    const bw = bh * img.mascot.naturalWidth / img.mascot.naturalHeight;
    g.save();
    const hops = [...(span.hops || []), ...(span.hopWords || []).map((w) => wordTime(w, span.from, span.to)).filter((x) => x != null)];
    let lift = 0, squash = 1;
    for (const h of hops) {
      const dt = t - h - (span.hopOffset ?? 0.05);
      if (dt > 0 && dt < 0.55) { lift += Math.sin(Math.PI * dt / 0.55) * H * 0.035; squash *= 1 + 0.06 * Math.sin(Math.PI * dt / 0.55); }
    }
    g.translate(W * (span.x ?? m.x ?? 0.5), H * (m.bottom ?? 0.99) - lift);
    g.rotate(Math.sin((t - span.from) * (m.sway ?? 3.2)) * 0.035);
    g.scale(1 / squash, squash);
    g.globalAlpha = clamp(pin * 2);
    g.drawImage(img.mascot, -bw / 2, -bh, bw, bh);
    g.restore();
  }
}

function buildDots(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  if (fade <= 0) return;
  const n = b.count || 10, cols = b.cols || 5;
  const rows = Math.ceil(n / cols);
  const x0 = box.buildX ?? box.x, w = b.wide ? box.w : box.buildW;
  const cell = Math.min(w / cols, (box.bottom - top) / rows);
  const r = cell * (b.bare ? 0.48 : 0.36);
  g.save();
  g.globalAlpha = fade;
  const lit = b.highlight || 0;
  for (let i = 0; i < n; i++) {
    const p = snappy(t - b.at - i * (b.every ?? 0.07));
    if (p <= 0) continue;
    const cx = x0 + cell * (i % cols + 0.5), cy = top + cell * (Math.floor(i / cols) + 0.5);
    const on = i < lit;
    const tint = color(on ? (b.highlightColor || 'danger') : (b.color || 'highlight'));
    g.save();
    g.translate(cx, cy);
    const pulse = on ? 1 + 0.12 * Math.max(0, Math.sin((t - b.at) * 5)) * Math.exp(-Math.max(0, t - b.at - 1.2) * 0.8) : 1;
    const k = (0.6 + 0.4 * clamp(p, 0, 1.05)) * pulse;
    g.scale(k, k);
    g.globalAlpha = fade * clamp(p) * (lit && !on ? 0.55 : 1);
    if (!b.bare || on) {
      g.fillStyle = rgba(tint, on ? 0.2 : 0.14);
      g.beginPath();
      g.arc(0, 0, r, 0, Math.PI * 2);
      g.fill();
    }
    const ir = b.bare ? r * 0.9 : r * 0.62;
    icon(b.icon || 'house', -ir, -ir, ir * 2, tint, 1, b.bare ? 2.2 : 2);
    g.restore();
  }
  const gridBottom = top + cell * rows;
  (b.lines || []).forEach((ln, j) => {
    const p = clamp((t - b.at - (ln.delay ?? 0.6 + j * 0.5)) / 0.3);
    if (p <= 0) return;
    g.save();
    g.globalAlpha = fade * p;
    g.font = font(box.row * (ln.size || 0.9), ln.heading !== false);
    g.textAlign = 'left';
    g.fillStyle = color(ln.color || 'ink');
    g.fillText(ln.text, x0, gridBottom + box.row * (1.1 + j * 1.25) + (1 - p) * box.row * 0.3, box.buildW);
    g.restore();
  });
  g.restore();
}

function buildFlow(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  if (fade <= 0) return;
  const nodes = b.nodes || [];
  const n = nodes.length;
  const x0 = box.buildX ?? box.x, w = b.width ? W * b.width : b.wide ? box.w : box.buildW;
  const cellW = w / n;
  const r = Math.min(cellW * (b.radius ?? 0.32), box.row * (b.maxR ?? 1.6));
  const cy = top + r * 1.15 - box.row * (b.lift || 0);
  const arrive = flowDotArrivals(b, n, t);
  const every = b.every ?? 0.45;
  const centre = (i) => x0 + cellW * (i + 0.5);
  g.save();
  g.globalAlpha = fade;
  for (let i = 0; i < n - 1; i++) {
    const p = clamp((t - b.at - i * every - every * 0.6) / (every * 0.6));
    if (p <= 0) continue;
    const ax = centre(i) + r * 1.1, bx = centre(i + 1) - r * 1.1;
    const ex = ax + (bx - ax) * easeOutCubic(p);
    const dim = b.cross != null && (b.cross === i || b.cross === i + 1) && t > b.at + (b.crossAt ?? 1.5);
    g.strokeStyle = rgba(color('accent'), dim ? 0.3 : 0.85);
    g.lineWidth = Math.max(3, r * 0.08);
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(ax, cy);
    g.lineTo(ex, cy);
    g.stroke();
    if (p >= 1) {
      g.beginPath();
      g.moveTo(bx - r * 0.25, cy - r * 0.2);
      g.lineTo(bx, cy);
      g.lineTo(bx - r * 0.25, cy + r * 0.2);
      g.stroke();
    }
  }
  nodes.forEach((nd, i) => {
    const p = snappy(t - b.at - i * every);
    if (p <= 0) return;
    const cx = centre(i);
    const crossed = b.cross === i && t > b.at + (b.crossAt ?? 1.5);
    const lit = b.light ? t >= b.at + (b.lightAt ?? 0) + i * (b.lightEvery ?? every) : true;
    const tint = color(nd.color || (crossed ? 'inkMuted' : lit ? 'highlight' : 'inkMuted'));
    g.save();
    g.translate(cx, cy);
    const bump = arrive[i] != null && arrive[i] >= 0 ? 0.14 * Math.exp(-arrive[i] * 7) : 0;
    const k = 0.7 + 0.3 * clamp(p, 0, 1.05) + bump;
    g.scale(k, k);
    g.globalAlpha = fade * clamp(p);
    g.fillStyle = rgba(tint, (lit && !crossed ? 0.16 : 0.08) + bump * 1.5);
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = rgba(tint, 0.5);
    g.lineWidth = 2;
    g.stroke();
    icon(nd.icon || 'doc', -r * 0.55, -r * 0.55, r * 1.1, tint, 1, 1.9);
    g.restore();
    g.save();
    g.globalAlpha = fade * clamp(p);
    g.font = font(box.row * (b.labelSize || 0.72), true);
    g.textAlign = 'center';
    g.fillStyle = color(crossed ? 'inkMuted' : 'ink');
    String(nd.label || '').split('\n').forEach((ln, j) => g.fillText(ln, cx, cy + r * 1.25 + box.row * (0.75 + j * 0.85), cellW * 0.98));
    g.restore();
    if (crossed) {
      const ct = t - b.at - (b.crossAt ?? 1.5);
      icon('cross', cx - r * 0.75, cy - r * 0.75, r * 1.5, color('danger'), clamp(ct / 0.3), 2.4);
    }
  });
  if (b.bypass && n > 0) {
    const bt = t - b.at - bypassStart(b);
    const p = clamp(bt / 0.7);
    if (p > 0) {
      const ax = centre(0), bx = centre(n - 1);
      const by = cy + r * 1.25 + box.row * (1.7 + 0.85 * Math.max(...nodes.map((nd) => String(nd.label || '').split('\n').length - 1)));
      const sag = box.row * 1.3;
      g.save();
      g.strokeStyle = color('highlight');
      g.lineWidth = Math.max(4, r * 0.1);
      g.lineCap = 'round';
      g.beginPath();
      const steps = 40;
      for (let k = 0; k <= steps * easeOutCubic(p); k++) {
        const u = k / steps;
        const x = ax + (bx - ax) * u, y = by + sag * 4 * u * (1 - u);
        if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
      if (p >= 1) {
        g.beginPath();
        g.moveTo(bx - r * 0.3, by - r * 0.05);
        g.lineTo(bx, by);
        g.lineTo(bx - r * 0.12, by + r * 0.28);
        g.stroke();
      }
      g.globalAlpha = p * fade;
      g.font = font(box.row * 0.85, true);
      g.textAlign = 'center';
      g.fillStyle = color(b.bypass.color || 'highlight');
      g.fillText(b.bypass.label || '', (ax + bx) / 2, by + sag * 0.55, w);
      g.restore();
      if (p >= 1 && b.dot) {
        const u = ((t - b.at - bypassStart(b) - 0.7) % (b.dot.period ?? 1.3)) / (b.dot.period ?? 1.3);
        const e = easeInOut(u);
        flowDot(ax + (bx - ax) * e, by + sag * 4 * e * (1 - e), r, fade * clamp(Math.min(u, 1 - u) * 8));
      }
    }
  }
  if (b.dot) {
    const d = b.dot;
    const start = b.at + (d.at ?? n * every);
    const dt = t - start;
    if (dt > 0 && b.cross != null) {
      const stopAt = b.bypass ? b.at + bypassStart(b) + 0.7 : Infinity;
      if (t < stopAt) {
        const per = d.period ?? 1.1;
        const u = (dt % per) / per;
        const ax = centre(0) + r * 1.1, bx = centre(b.cross) - r * 1.15;
        const blocked = t > b.at + (b.crossAt ?? 1.5);
        const run = blocked ? clamp(u / 0.6) : u;
        const ex = blocked ? ax + (bx - ax) * easeOutCubic(run) + (u > 0.6 ? Math.sin((u - 0.6) * 60) * r * 0.05 * (1 - (u - 0.6) / 0.4) : 0) : ax + (centre(n - 1) - r * 1.1 - ax) * easeInOut(u);
        const alpha = blocked && u > 0.6 ? 1 - (u - 0.6) / 0.4 : clamp(Math.min(u, 1 - u) * 8);
        flowDot(ex, cy, r, fade * alpha, blocked && u > 0.6 ? 'danger' : 'highlight');
      }
    } else if (dt > 0 && d.loop) {
      const seg = d.segment ?? 0.55;
      const per = seg * (n - 1) + (d.back ?? 0.8);
      const u = dt % per;
      if (u < seg * (n - 1)) {
        const i = Math.floor(u / seg), f = easeInOut((u - i * seg) / seg);
        flowDot(centre(i) + (centre(i + 1) - centre(i)) * f, cy, r, fade);
      } else {
        const f = easeInOut((u - seg * (n - 1)) / (d.back ?? 0.8));
        const ax = centre(n - 1), bx = centre(0), dip = r * 1.25 + box.row * (b.loopDrop ?? 1.7);
        g.save();
        g.globalAlpha = fade * 0.35;
        g.strokeStyle = color('accent');
        g.setLineDash([8, 10]);
        g.lineWidth = 3;
        g.beginPath();
        g.moveTo(ax, cy + r * 1.05);
        g.quadraticCurveTo((ax + bx) / 2, cy + dip * 1.6, bx, cy + r * 1.05);
        g.stroke();
        g.restore();
        const q = (1 - f), qx = q * q * ax + 2 * q * f * (ax + bx) / 2 + f * f * bx;
        const qy = q * q * (cy + r * 1.05) + 2 * q * f * (cy + dip * 1.6) + f * f * (cy + r * 1.05);
        flowDot(qx, qy, r, fade * 0.8);
      }
    }
  }
  g.restore();
}

function bypassStart(b) {
  return b.bypassAt ?? (b.crossAt ?? 1.5) + 0.5;
}

function flowDotArrivals(b, n, t) {
  const out = [];
  const d = b.dot;
  if (!d || !d.loop) return out;
  const start = b.at + (d.at ?? n * (b.every ?? 0.45));
  const dt = t - start;
  if (dt < 0) return out;
  const seg = d.segment ?? 0.55;
  const per = seg * (n - 1) + (d.back ?? 0.8);
  const u = dt % per;
  for (let i = 0; i < n; i++) {
    const at = i === 0 ? 0 : i * seg;
    out[i] = u >= at ? u - at : (dt >= per ? u + per - at : null);
  }
  return out;
}

function flowDot(x, y, r, alpha, tone = 'highlight') {
  if (alpha <= 0.01) return;
  g.save();
  g.globalAlpha = alpha;
  const c = color(tone);
  g.fillStyle = rgba(c, 0.25);
  g.beginPath();
  g.arc(x, y, r * 0.34, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = c;
  g.beginPath();
  g.arc(x, y, r * 0.17, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function buildPicture(b, box, top, t, s, key) {
  const pic = img[key];
  const fade = exitFade(t, s.out);
  const p = smooth(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const x0 = box.buildX ?? box.x, w = b.wide ? box.w : box.buildW;
  const h = Math.min((b.bottom ? H * b.bottom : box.bottom) - top, w * (b.ratio || 1.15));
  const y = top + (1 - p) * h * 0.12;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = 40;
  g.shadowOffsetY = 14;
  roundRect(x0, y, w, h, box.row * 0.6);
  g.fillStyle = color('surface');
  g.fill();
  g.shadowColor = 'transparent';
  g.clip();
  if (pic) {
    const [cx, cy, cw] = b.crop || [0, 0, 1];
    const sw = pic.naturalWidth * cw, sh = sw * h / w;
    const push = 1 + (b.push ?? 0.04) * clamp((t - b.at) / Math.max(0.1, s.out - b.at));
    const dw = sw / push, dh = sh / push;
    const sx = pic.naturalWidth * cx + (sw - dw) / 2, sy = pic.naturalHeight * cy + (sh - dh) / 2;
    g.drawImage(pic, sx, sy, dw, dh, x0, y, w, h);
  } else {
    placeholder(x0, y, w, h, b.file || key);
  }
  g.restore();
  if (b.chip) {
    const cs = box.row * 0.8;
    g.save();
    g.globalAlpha = clamp(p) * fade;
    g.font = font(cs);
    const cw = g.measureText(b.chip).width + cs * 1.2;
    g.fillStyle = color(b.chipColor || 'highlight');
    const chipX = x0 + w - cw - cs * 0.6;
    roundRect(chipX, y - cs * 0.75, cw, cs * 1.5, cs * 0.75);
    g.fill();
    g.fillStyle = color('surface');
    g.textAlign = 'left';
    g.fillText(b.chip, chipX + cs * 0.6, y + cs * 0.33);
    g.restore();
  }
}

function fitFont(text, size, maxW, heading = true) {
  g.font = font(size, heading);
  const m = g.measureText(text).width;
  if (m > maxW) { size *= maxW / m; g.font = font(size, heading); }
  return size;
}

function buildStamp(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  const p = smooth(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const x0 = box.x, w = b.width ? W * b.width : box.w;
  const labelSize = box.row * 0.95;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  g.textAlign = 'left';
  g.fillStyle = color(b.labelColor || 'inkMuted');
  g.font = font(labelSize, false);
  const ly = top + labelSize;
  if (b.label) g.fillText(b.label, x0, ly + (1 - clamp(p)) * labelSize * 0.4, w);
  const size = fitFont(b.value, box.head * (b.size || 1.6), w);
  const vy = ly + size * 1.05;
  const counting = b.countFrom != null ? Math.round(lerp(b.countFrom, b.countTo, easeInOut((t - b.at) / (b.countFor ?? 0.9)))) : null;
  const text = counting != null ? `RM${counting.toLocaleString('en-MY')}` : b.value;
  g.fillStyle = color(b.color || 'ink');
  g.fillText(text, x0, vy);
  g.restore();
  const st = t - (b.stampAt ?? b.at + 1);
  if (st <= 0) return;
  const k = st < 0.12 ? 1.8 - 0.8 * easeOutCubic(st / 0.12) : 1 + 0.06 * Math.exp(-(st - 0.12) * 10) * Math.cos((st - 0.12) * 30);
  const stampSize = box.head * 0.62;
  g.save();
  g.font = font(stampSize);
  g.letterSpacing = `${(stampSize * 0.12).toFixed(1)}px`;
  const tw = g.measureText(b.stamp).width;
  const subSize = stampSize * 0.62;
  const bw = tw + stampSize * 1.1, bh = stampSize * 1.5 + (b.stampSub ? subSize * 1.15 : 0);
  const cx = x0 + (b.stampX ?? 0.5) * w, cy = vy + (b.stampY ?? 0.55) * size;
  g.translate(cx, cy);
  g.rotate((b.stampTilt ?? -7) * Math.PI / 180);
  g.scale(k, k);
  g.globalAlpha = clamp(st / 0.08) * fade;
  const ink = color(b.stampColor || 'highlight');
  g.fillStyle = rgba(color('surface'), 0.94);
  roundRect(-bw / 2, -bh / 2, bw, bh, stampSize * 0.22);
  g.fill();
  g.strokeStyle = ink;
  g.lineWidth = Math.max(6, stampSize * 0.09);
  g.stroke();
  g.fillStyle = ink;
  g.textAlign = 'center';
  g.fillText(b.stamp, stampSize * 0.06, -bh / 2 + stampSize * 1.12);
  if (b.stampSub) {
    g.letterSpacing = '0px';
    g.font = font(subSize);
    g.fillText(b.stampSub, 0, -bh / 2 + stampSize * 1.12 + subSize * 1.15);
  }
  g.restore();
  const ring = clamp(st / 0.7);
  if (ring < 1) {
    g.save();
    g.globalAlpha = (1 - ring) * 0.5 * fade;
    g.strokeStyle = color(b.stampColor || 'highlight');
    g.lineWidth = 4;
    g.beginPath();
    g.ellipse(cx, cy, bw * (0.55 + ring * 0.35), bh * (0.6 + ring * 0.6), (b.stampTilt ?? -7) * Math.PI / 180, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }
}

function buildShare(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  const p = smooth(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const x0 = box.x, w = W * (b.width ?? 0.611);
  const share = clamp(Number(b.value) / Number(b.max));
  const big = box.head * (b.bigSize || 2.3);
  g.save();
  g.globalAlpha = fade;
  const np = easeInOut((t - b.at - (b.countAt ?? 0.9)) / 0.7);
  if (np > 0) {
    const shown = (Number(b.percent) * np).toFixed(1);
    g.globalAlpha = fade * clamp(np * 3);
    g.font = font(big);
    g.textAlign = 'left';
    g.fillStyle = color(b.bigColor || 'highlight');
    const by = top + big * 0.82;
    g.fillText(`${shown}%`, x0, by);
    const bw = g.measureText(`${Number(b.percent).toFixed(1)}%`).width;
    g.font = font(box.row * 1.1);
    g.fillStyle = color('ink');
    String(b.bigLabel || '').split('\n').forEach((ln, j) => g.fillText(ln, x0 + bw + box.row * 0.45, by - big * 0.38 + j * box.row * 1.2, w - bw - box.row * 0.45));
  }
  g.globalAlpha = fade;
  const barY = top + big * 1.15, barH = box.row * (b.barH ?? 1.7);
  const grow = easeOutCubic((t - b.at) / 0.6);
  g.fillStyle = rgba(color(b.maxColor || 'highlight'), 0.16);
  roundRect(x0, barY, w * grow, barH, barH * 0.25);
  g.fill();
  g.strokeStyle = rgba(color(b.maxColor || 'highlight'), 0.55);
  g.lineWidth = 3;
  g.stroke();
  if (grow > 0.9) {
    g.globalAlpha = fade * clamp((grow - 0.9) * 10);
    g.font = font(box.row * 0.85);
    g.textAlign = 'right';
    g.fillStyle = color(b.maxTextColor || 'ink');
    g.fillText(b.maxText, x0 + w - box.row * 0.45, barY + barH * 0.64);
  }
  const vp = playful(t - b.at - (b.valueAt ?? 0.55));
  if (vp > 0) {
    const vw = Math.max(box.row * 0.28, w * share);
    const pulse = 1 + 0.25 * Math.max(0, Math.sin((t - b.at) * 6)) * Math.exp(-Math.max(0, t - b.at - 1.4));
    g.globalAlpha = fade * clamp(vp * 2);
    g.fillStyle = color(b.valueColor || 'danger');
    g.save();
    g.translate(x0, barY + barH / 2);
    g.scale(1, clamp(vp, 0, 1.1) * pulse);
    roundRect(0, -barH / 2, vw, barH, Math.min(barH * 0.25, vw / 2));
    g.fill();
    g.restore();
    g.font = font(box.row * 0.9);
    g.textAlign = 'left';
    g.fillStyle = color(b.valueColor || 'danger');
    const arrowX = x0 + vw / 2;
    g.fillText(b.valueText, x0, barY + barH + box.row * 1.25, w);
    g.strokeStyle = color(b.valueColor || 'danger');
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(arrowX, barY + barH + box.row * 0.12);
    g.lineTo(arrowX, barY + barH + box.row * 0.35);
    g.stroke();
  }
  if (b.note) {
    const q = clamp((t - b.at - (b.noteAt ?? 1.6)) / 0.35);
    if (q > 0) {
      g.globalAlpha = fade * q;
      g.font = font(box.row * 0.8, false);
      g.fillStyle = color('inkMuted');
      g.textAlign = 'left';
      g.fillText(b.note, x0, barY + barH + box.row * 2.45, w);
    }
  }
  g.restore();
}

function wrapText(text, size, maxW, heading) {
  g.font = font(size, heading);
  const out = [];
  for (const para of String(text).split('\n')) {
    let row = '';
    for (const word of para.split(/\s+/)) {
      const next = row ? `${row} ${word}` : word;
      if (row && g.measureText(next).width > maxW) { out.push(row); row = word; } else row = next;
    }
    out.push(row);
  }
  return out;
}

function buildQuote(b, box, top, t, s) {
  const fade = exitFade(t, s.out);
  const p = smooth(t - b.at);
  if (p <= 0 || fade <= 0) return;
  const x0 = box.x, w = W * (b.width ?? 0.611);
  const pad = box.row * 0.6;
  const size = box.row * (b.size ?? 0.92);
  const lineH = size * 1.28;
  const inner = w - pad * 2;
  const rows = wrapText(b.text, size, inner, false);
  const head = box.row * 0.72;
  const h = pad * 1.1 + head * 1.4 + rows.length * lineH + pad * 0.6;
  const y = top + (1 - clamp(p)) * box.row * 0.6;
  g.save();
  g.globalAlpha = clamp(p) * fade;
  const flash = Math.exp(-Math.max(0, t - b.at) * 5);
  g.shadowColor = 'rgba(15,40,38,0.22)';
  g.shadowBlur = 34;
  g.shadowOffsetY = 12;
  roundRect(x0, y, w, h, box.row * 0.35);
  g.fillStyle = color('surface');
  g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = color('accent');
  g.fillRect(x0, y + box.row * 0.3, Math.max(6, box.row * 0.12), h - box.row * 0.6);
  if (flash > 0.02) {
    g.fillStyle = rgba(color('accentSoft'), flash);
    roundRect(x0, y, w, h, box.row * 0.35);
    g.fill();
  }
  g.font = font(head, true);
  g.letterSpacing = `${(head * 0.08).toFixed(1)}px`;
  g.textAlign = 'left';
  g.fillStyle = color('accent');
  g.fillText(String(b.title).toUpperCase(), x0 + pad, y + pad * 1.1 + head * 0.8, inner);
  g.letterSpacing = '0px';
  const mark = String(b.mark || '');
  const sweep = easeInOut((t - (b.markAt ?? b.at + 1)) / 0.55);
  g.font = font(size, false);
  let seen = 0;
  const joined = rows.join(' ');
  const mStart = mark ? joined.indexOf(mark) : -1;
  rows.forEach((row, r) => {
    const ry = y + pad * 1.1 + head * 1.4 + r * lineH + size;
    if (mStart >= 0 && sweep > 0) {
      const a = Math.max(mStart - seen, 0), e = Math.min(mStart + mark.length - seen, row.length);
      if (e > a) {
        const x1 = g.measureText(row.slice(0, a)).width, x2 = g.measureText(row.slice(0, e)).width;
        const total = mark.length, before = Math.max(0, seen - mStart);
        const local = clamp((sweep * total - before) / (e - a));
        g.fillStyle = rgba(color(b.markColor || 'highlight'), 0.22);
        g.fillRect(x0 + pad + x1 - size * 0.08, ry - size * 0.86, (x2 - x1 + size * 0.16) * local, size * 1.08);
      }
    }
    g.fillStyle = color('ink');
    g.fillText(row, x0 + pad, ry);
    seen += row.length + 1;
  });
  g.restore();
  return y + h;
}

function wordTime(word, from, to) {
  const want = String(word).toLowerCase().replace(/[^a-z0-9']/g, '');
  for (const line of spoken) for (const w of line) {
    if (w.start >= from - 0.05 && w.start <= to && String(w.text).toLowerCase().replace(/[^a-z0-9']/g, '') === want) return w.start;
  }
  return null;
}

function headStart(s) {
  const base = s.at + (s.kicker ? (s.headLead ?? STORY.headLead ?? 0.18) : 0);
  if (!s.headWord) return base;
  const at = wordTime(s.headWord, s.at, s.out);
  return at == null ? base : Math.max(base, at + (s.headOffset ?? -0.05));
}

function buildAt(s, b) {
  if (b.atWord) {
    const at = wordTime(b.atWord, s.at, s.out);
    if (at != null) return at + (b.atOffset ?? -0.1);
  }
  return b.at;
}

function explainerLogo(t) {
  const e = STORY.explainerLogo;
  if (!e || !img.logo) return;
  const live = STORY.explainer.some((s) => t >= s.at - 0.2 && t <= s.out + EXIT);
  if (!live || (STORY.lockup && t > STORY.lockup.at - 0.05)) return;
  const size = (L.vertical ? W : H) * (e.size || 0.085);
  g.save();
  g.globalAlpha = e.alpha ?? 0.9;
  g.drawImage(img.logo, L.vertical ? W * 0.115 : L.textX, H * (e.y ?? 0.07), size, size);
  g.restore();
}

function explainer(t) {
  const box = explainerBox();
  explainerLogo(t);
  STORY.explainer.forEach((s, i) => {
    if (t < s.at - 0.01 || t > s.out + EXIT) return;
    g.save();
    sceneTransform(s, t);
    explainerScene(s, i, box, t);
    g.restore();
  });
}

function sceneTransform(s, t) {
  if ((STORY.explainerMotion || 'calm') !== 'punch') return;
  const e = clamp(smooth(t - s.at));
  const leave = easeOutCubic((t - s.out) / EXIT);
  const k = 1 + (1 - e) * 0.06 + leave * 0.04;
  const cx = W / 2, cy = H * 0.3;
  g.translate(cx, cy + (1 - e) * H * 0.03 - leave * H * 0.04);
  g.scale(k, k);
  g.translate(-cx, -cy);
}

function runBuild(s, b, box, top, t, head, key) {
  const bb = { ...b, at: buildAt(s, b) ?? head.ready + 0.1 };
  if (b.stampWord) { const w = wordTime(b.stampWord, s.at, s.out); bb.stampAt = w == null ? bb.at + 1 : w + (b.stampOffset ?? 0); }
  if (b.markWord) { const w = wordTime(b.markWord, s.at, s.out); bb.markAt = w == null ? bb.at + 1 : w + (b.markOffset ?? -0.1); }
  if (b.untilWord) { const w = wordTime(b.untilWord, s.at, s.out); if (w != null) bb.until = w + (b.untilOffset ?? 0); }
  const sc = bb.until != null ? { ...s, out: Math.min(s.out, bb.until) } : s;
  if (bb.kind === 'checklist' || bb.kind === 'cards') buildRows(bb, box, top, t, sc);
  else if (bb.kind === 'bar') buildBar(bb, box, top, t, sc);
  else if (bb.kind === 'icon') buildIcon(bb, box, top, t, sc);
  else if (bb.kind === 'dots') buildDots(bb, box, top, t, sc);
  else if (bb.kind === 'flow') buildFlow(bb, box, top, t, sc);
  else if (bb.kind === 'picture') buildPicture(bb, box, top, t, sc, key);
  else if (bb.kind === 'stamp') buildStamp(bb, box, top, t, sc);
  else if (bb.kind === 'share') buildShare(bb, box, top, t, sc);
  else if (bb.kind === 'quote') buildQuote(bb, box, top, t, sc);
  return bb;
}

function explainerScene(s, i, box, t) {
  if (s.kicker) kickerLine(s, box, t);
  const head = explainerHeadline(s, box, t);
  const b = s.build;
  if (!b) return;
  const top = L.vertical ? Math.max(box.top, head.bottom + box.row * 1.6) : box.top;
  const bb = runBuild(s, b, box, top, t, head, `explainer${i}`);
  if (s.then) runBuild(s, s.then, box, top, t, head, `explainer${i}b`);
  if (s.source) {
    const fade = exitFade(t, s.out);
    const p = clamp((t - (bb.at + (bb.kind === 'picture' ? 0.7 : 0.3))) / 0.4);
    if (p > 0 && fade > 0) {
      g.save();
      g.globalAlpha = p * fade;
      g.font = font(box.row * 0.72, false);
      g.textAlign = 'left';
      g.fillStyle = color(s.sourceColor || 'inkMuted');
      g.fillText(s.source, box.x, (b.bottom ? H * b.bottom : box.bottom) + box.row * 0.6, box.buildW);
      g.restore();
    }
  }
}

function explainerCues(s) {
  const clicks = [], whooshes = [], alerts = [];
  for (const e of s.explainer) {
    const words = String(e.headline).trim().split(/\s+/);
    const start = headStart(e);
    const step = e.step ?? 0.11;
    const typing = s.explainerMotion === 'type';
    const total = words.join(' ').length, cps = e.cps ?? 24;
    const sync = typing ? typeTimes(e, words, start) : null;
    if (sync) words.forEach((w, i) => { for (let c = 0; c < w.length; c += 2) clicks.push(sync[i] + c / cps); });
    else if (typing) for (let c = 0; c < total; c += 2) clicks.push(start + c / cps);
    else words.forEach((_, i) => clicks.push(start + i * step));
    whooshes.push({ at: e.at - 0.12, length: 0.35, rising: true, gain: 0.05, pan: 0.2 });
    const b = e.build;
    if (b) {
      const at = buildAt(e, b) ?? (typing ? start + total / cps + 0.1 : start + words.length * step + 0.15);
      if (b.alert) alerts.push({ at: at + (b.kind === 'bar' ? (b.delay ?? 0.7) : 0), length: b.alertLength ?? 0.9 });
      if (b.kind === 'checklist' || b.kind === 'cards') (b.items || []).forEach((_, i) => clicks.push(at + i * (b.every ?? 0.45) + 0.25));
    }
    for (const x of [b, e.then]) {
      if (!x) continue;
      if (x.stampWord) { const w = wordTime(x.stampWord, e.at, e.out); if (w != null) alerts.push({ at: w + (x.stampOffset ?? 0), length: 0.6 }); }
      if (x.alertWord) { const w = wordTime(x.alertWord, e.at, e.out); if (w != null) alerts.push({ at: w + (x.alertOffset ?? 0), length: 0.6 }); }
      if (x !== b && x.whoosh !== false) { const at = buildAt(e, x); if (at != null) whooshes.push({ at: at - 0.1, length: 0.3, rising: true, gain: 0.04, pan: -0.2 }); }
    }
  }
  return { clicks, whooshes, alerts };
}

function drawFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'none';
  g.fillStyle = C.page;
  g.fillRect(0, 0, W, H);
  ambient(t);
  backdrops(t);
  opening(t);
  hook(t);
  drawDevice(t);
  captions(t);
  counters(t);
  photos(t);
  numberScene(t);
  statScene(t);
  products(t);
  explainer(t);
  mascot(t);
  lockup(t);
  credit(t);
  outro(t);
  subtitles(t);
}

function draw(t) {
  const mb = STORY.motionBlur;
  const samples = mb ? (mb.samples ?? 8) : 1;
  if (samples > 1 && motionAt(t) > (mb.threshold ?? 0.004)) {
    const shutter = (mb.shutter ?? 0.5) / 30;
    const fg = frameLayer.getContext('2d'), bg = blurLayer.getContext('2d');
    bg.setTransform(1, 0, 0, 1, 0, 0);
    bg.globalAlpha = 1;
    bg.clearRect(0, 0, W, H);
    try {
      for (let k = 0; k < samples; k++) {
        g = fg;
        drawFrame(t - shutter / 2 + (shutter * k) / (samples - 1));
        bg.globalAlpha = 1 / (k + 1);
        bg.drawImage(frameLayer, 0, 0);
      }
    } finally {
      g = main;
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.drawImage(blurLayer, 0, 0);
  } else {
    g = main;
    drawFrame(t);
  }
  if (DRAFT) draftStamp(t);
}

function buildCues() {
  const s = STORY, m = s.music, d = s.device;
  const pushes = s.screens.filter((x, i) => i > 0 && x.via !== 'fade').map((x) => ({ at: x.from - 0.05, length: 0.35, rising: true, gain: 0.07, pan: 0.4 }));
  const cues = {
    bpm: m.bpm, mood: m.mood, duration: s.duration, groove: m.groove, hats_from: m.hatsFrom, intro_bell: m.introBell,
    taps: s.screens.length ? s.taps.map((x) => x.at) : [],
    whooshes: s.screens.length ? [
      { at: d.enter - 0.3, length: 0.6, rising: true, gain: 0.1 },
      ...pushes,
      { at: d.leave - 0.05, length: 0.5, rising: false, gain: 0.08 },
    ] : [],
    chimes: s.success && s.screens.length ? [
      { at: s.success.at - 0.05, note: 84, gain: 0.12, pan: -0.15 },
      { at: s.success.at + 0.07, note: 91, gain: 0.08, pan: 0.15 },
    ] : [],
    ending: s.lockup ? s.lockup.at : undefined,
  };
  if (s.outro) {
    cues.whooshes.push({ at: s.outro.at - 0.15, length: 0.55, rising: true, gain: 0.09 });
    cues.chimes.push({ at: s.outro.at + 0.45, note: 84, gain: 0.08, length: 1.4 });
  }
  if (s.number) {
    cues.ticks = { from: s.number.drop, every: s.number.every, count: s.number.count };
    cues.hit = s.number.pill;
    cues.chimes.push({ at: s.number.pill, note: 79, gain: 0.08, length: 1.2 });
  }
  if (s.stat) {
    cues.hit = cues.hit ?? s.stat.at + (s.stat.count ?? 0.9);
    cues.chimes.push({ at: s.stat.at + (s.stat.count ?? 0.9), note: 79, gain: 0.08, length: 1.2 });
  }
  if (s.voice.length) {
    cues.voice = s.voice.map((v, i) => {
      const under = s.captions.find((c) => c.in <= Number(v.at) && Number(v.at) < c.out);
      return { at: Number(v.at), text: String(v.text).trim(), say: String(v.say || v.text).trim(), file: v.file || `assets/voice/${String(i + 1).padStart(2, '0')}.wav`, captionOut: under ? under.out : undefined };
    });
  }
  if (s.explainer.length) {
    const ex = explainerCues(s);
    cues.whooshes.push(...ex.whooshes);
    cues.clicks = ex.clicks.map((x) => Math.round(x * 1000) / 1000);
    cues.alerts = ex.alerts;
  }
  const round = (x) => Math.round(x * 1000) / 1000;
  for (const list of [cues.whooshes, cues.chimes, cues.alerts || []]) for (const c of list) c.at = round(c.at);
  return cues;
}

window.seek = (t) => { draw(t); return true; };
</script>
